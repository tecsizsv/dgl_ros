/**:
  ros__parameters:
    world_frame: world

camera_base_tf:
  ros__parameters:
    # 5G lab: x 0.0, y 0.0, z 1.95, roll 0.0, pitch 1.5707963, yaw 0.0
    # Other camera:
    x: 0.0
    y: 0.0
    z: 0.69 # camera height above the table
    roll: 0.02 # around the x-axis
    pitch: 1.2 # around the y-axis
    yaw: 0.0 # around the z-axis

grasp_client:
  ros__parameters:
    z_min: -0.02 # just above the table
    z_max: 0.2 # the highest expected object
    margin: 0.0
    camera_frame: camera_color_optical_frame
    table_pos: [0.37, 0.0, -0.05] # box center in world frame [m]
    table_dim: [0.7, 1.0, 0.1] # box size x, y, z [m]

object_detector:
  ros__parameters:
    cropping: False
    crop: [0, 0, 450, 720] # x1, y1, x2, y2, (left -> right, top ->bottom)
    # Options: yolo26m-objv1-150.pt (Objects365), yolo26m.pt (COCO), yolov8s-world.pt (World)
    model: yolo26m-objv1-150.pt
    # Only used with a -world model
    classes: ["cardboard box", "battery", "bottle", "rod", "mug"]
    conf: 0.45 # detection confidence threshold (0..1)
    device: "cuda:0" # or "cpu"
    use_yolo: True # if True, uses YOLO for object detection; if False, uses GPD for grasp detection
